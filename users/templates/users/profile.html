{% extends "main/base.html" %}

{% block title %}My profile · Vezline{% endblock %}

{% block content %}
<div class="vz-page vz-page--narrow">
    <div class="vz-panel vz-profile">
        <div class="vz-profile__head">
            <div class="vz-profile__avatar" aria-hidden="true">{{ user.email|first|upper }}</div>
            <div>
                <span class="vz-eyebrow">Your account</span>
                <h1>My profile</h1>
            </div>
        </div>

        <dl class="vz-profile__facts">
            <div>
                <dt>Email address</dt>
                <dd>{{ user.email }}</dd>
            </div>
            <div>
                <dt>Phone number</dt>
                <dd>{{ user.phone|default:"Not provided" }}</dd>
            </div>
        </dl>

        <div class="vz-actions">
            <a href="{% url 'profile-edit' %}" class="vz-btn">Edit profile</a>
            <a href="{% url 'booking-list' %}" class="vz-btn vz-btn--ghost">My bookings</a>
            <a href="{% url 'payment-list' %}" class="vz-btn vz-btn--ghost">Payments</a>
        </div>
    </div>
</div>
{% endblock %}
