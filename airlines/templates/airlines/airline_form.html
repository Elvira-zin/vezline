<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"> <title>Create Airline</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
  </head>
  <body>
    <h1>Create Airline</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">
          {% if form.instance.pk %}
              Edit Airline
          {% else %}
              Create Airline
          {% endif %}
      </button>
    </form>
  </body>
</html>
