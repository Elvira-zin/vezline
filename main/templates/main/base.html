<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Vezline{% endblock %}</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >
    {% load static %}
    <link rel="stylesheet" href="{% static 'main/css/auth.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            Vezline
        </a>

        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'home' %}">
                Home
            </a>

            <a class="nav-link" href="{% url 'airport-list' %}">
                Airports
            </a>

            <a class="nav-link" href="{% url 'airline-list' %}">
                Airlines
            </a>

            <a class="nav-link" href="{% url 'airplane-list' %}">
                Airplanes
            </a>

            <a class="nav-link" href="{% url 'flight-list' %}">
                Flights
            </a>

            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'booking-list' %}">
                    Bookings
                </a>
                <a class="nav-link" href="{% url 'profile' %}">
                    {{user.email}}
                </a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="nav-link border-0 bg-transparent">
                        Logout
                    </button>
                </form>
            {% else %}
                <a class="nav-link" href="{% url 'login' %}">
                    Login
                </a>
                <a class="nav-link" href="{% url 'register' %}">
                    Register
                </a>
            {% endif %}

        </div>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
