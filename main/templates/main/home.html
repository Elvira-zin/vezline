{% extends "main/base.html" %}

{% block title %}
    Vezline
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="welcome-card text-center text-white rounded-4 mb-5">
        <div class="py-5">
            <div class="fs-1 mb-3">✈️</div>

            <h1 class="display-4 fw-bold mb-3">
                Welcome to Vezline
            </h1>

            <p class="lead mb-0">
                Your journey starts here.
            </p>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-2 flex-wrap">
        <a href="{% url 'airport-list' %}" class="btn btn-primary px-4">
            Airports
        </a>

        <a href="{% url 'airline-list' %}" class="btn btn-primary px-4">
            Airlines
        </a>

        <a href="{% url 'airplane-list' %}" class="btn btn-primary px-4">
            Airplanes
        </a>

        <a href="{% url 'flight-list' %}" class="btn btn-primary px-4">
            Flights
        </a>

        <a href="#" class="btn btn-primary px-4">
            Bookings
        </a>
    </div>

</div>

<style>
    .welcome-card {
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 20% 30%, rgba(80, 120, 255, 0.35), transparent 25%),
            radial-gradient(circle at 80% 70%, rgba(120, 70, 255, 0.3), transparent 25%),
            linear-gradient(135deg, #020617, #0b1b3d, #111827);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .welcome-card::before {
        content: "✦  ·  ⋆  ·  ✧  ·  ⋆  ·  ✦  ·  ⋆  ·  ✧  ·  ⋆  ·  ✦";
        position: absolute;
        inset: 20px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 14px;
        letter-spacing: 18px;
        line-height: 45px;
        pointer-events: none;
    }

    .welcome-card > div {
        position: relative;
        z-index: 1;
    }
</style>

{% endblock %}
